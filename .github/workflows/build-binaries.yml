name: Build binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_os: windows
            binary_name: coverity-metrics.exe
            build_cmd: pwsh -File packaging/build_binary.ps1
          - os: ubuntu-latest
            artifact_os: linux
            binary_name: coverity-metrics
            build_cmd: bash packaging/build_binary.sh

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install project + build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Build binary
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Determine artifact name
        id: name
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "artifact=coverity-metrics-${{ matrix.artifact_os }}-${version}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Build sdist/wheel and publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coverity-metrics
    permissions:
      contents: read
      # id-token is required for PyPI Trusted Publishing (OIDC).
      id-token: write
    env:
      # 'true' when a PYPI_API_TOKEN secret is configured; otherwise fall back to Trusted Publishing (OIDC).
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version=$(python -c "import re,pathlib; m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('coverity_metrics/__version__.py').read_text()); print(m.group(1))")
          echo "Tag version: $tag"
          echo "Package version: $pkg_version"
          if [[ "$tag" != "$pkg_version" ]]; then
            echo "::error::Git tag ($tag) does not match coverity_metrics/__version__.py ($pkg_version)"
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: env.HAS_PYPI_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI (API token)
        if: env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    name: Attach binaries to release
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          # Rename OS-specific binaries into predictable filenames for the release page.
          cp artifacts/coverity-metrics-windows-*/coverity-metrics.exe release/coverity-metrics-windows-${GITHUB_REF_NAME}.exe
          cp artifacts/coverity-metrics-linux-*/coverity-metrics       release/coverity-metrics-linux-${GITHUB_REF_NAME}
          chmod +x release/coverity-metrics-linux-${GITHUB_REF_NAME}
          cp config.json.example release/
          cp README.md release/
          ls -la release/

      - name: Extract CHANGELOG section for this version
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="release-notes.md"
          # Capture everything from "## [<version>] - <date>" up to (but not including) the next "## [" heading.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { p = 1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "::warning::No CHANGELOG.md entry found for version $version; falling back to a generic body."
            printf '## %s\n\nRelease %s.\n' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" > "$notes_file"
          fi
          echo "notes_path=$notes_file" >> "$GITHUB_OUTPUT"
          echo "----- release body preview -----"
          cat "$notes_file"
          echo "--------------------------------"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          body_path: ${{ steps.changelog.outputs.notes_path }}
          # Auto-generated "What's Changed" notes are appended below the CHANGELOG excerpt.
          generate_release_notes: true
