name: Build binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # `find-preflight-run` reads workflow runs + artifacts via `gh run list` and
  # the `actions/download-artifact` cross-run API.
  actions: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    # Only runs on manual dispatch (release.ps1 preflight) so tag push doesn't
    # rebuild the same binaries the preflight already produced. The tag-scoped
    # `release` job pulls those artifacts from the preflight run by run-id via
    # `find-preflight-run` below.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_os: windows
            binary_name: coverity-metrics.exe
            build_cmd: pwsh -File packaging/build_binary.ps1
          # Pinned to ubuntu-26.04 (preview) so PyInstaller picks up the runner's
          # OpenSSL 3.5.x for the bundled libcrypto.so.3 / libssl.so.3, instead of
          # Ubuntu 24.04's 3.0.13. Revert to ubuntu-latest once it flips to 26.04.
          # Produces a binary that requires glibc >= 2.38 (Ubuntu 24.04+, Debian
          # trixie+, Fedora 39+). Ubuntu 22.04 (glibc 2.35) hosts should use the
          # `linux-glibc2.35` binary below. RHEL/Rocky/Alma 9 (glibc 2.34) and
          # RHEL/Rocky/Alma 8 (glibc 2.28) aren't covered by any standalone
          # binary — install via `pip install coverity-metrics` from PyPI.
          - os: ubuntu-26.04
            artifact_os: linux
            binary_name: coverity-metrics
            build_cmd: bash packaging/build_binary.sh
          # Legacy-glibc Linux build. ubuntu-22.04 ships glibc 2.35, so the
          # bundled libpython3.14.so.1.0 links only against symbols available in
          # glibc <= 2.35. Runs on Ubuntu 22.04+, Debian 12 (glibc 2.36), Fedora
          # 36+, and any newer host — but NOT on RHEL/Rocky/Alma 9 (glibc 2.34)
          # or RHEL/Rocky/Alma 8 (glibc 2.28). Those enterprise hosts must
          # `pip install coverity-metrics` from PyPI — an earlier attempt at a
          # `manylinux_2_28`-based third variant was reverted in 1.1.10 because
          # the image's CPython 3.14 is linked against `libssl.so.1.1` and no
          # amount of `LD_LIBRARY_PATH` gymnastics can retarget that at a fresh
          # `libssl.so.3`. OpenSSL 3.5.7 and zlib 1.3.2 are still built from
          # source on this runner, so BDBA findings track the modern binary.
          # Artifact suffix `-glibc2.35-` keeps the release-page filename
          # self-documenting and prevents the `linux-v*` glob below from
          # accidentally grabbing both binaries into the same release file.
          - os: ubuntu-22.04
            artifact_os: linux-glibc2.35
            binary_name: coverity-metrics
            build_cmd: bash packaging/build_binary.sh

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install project + build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Diagnostic - identify libcrypto/libz sources (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "::group::CPython _ssl module location"
          python -c "import _ssl; print(_ssl.__file__)"
          echo "::endgroup::"

          echo "::group::_ssl.so shared-library dependencies"
          ldd "$(python -c 'import _ssl; print(_ssl.__file__)')"
          echo "::endgroup::"

          echo "::group::_hashlib.so shared-library dependencies"
          ldd "$(python -c 'import _hashlib; print(_hashlib.__file__)')" || true
          echo "::endgroup::"

          echo "::group::zlib.so shared-library dependencies"
          ldd "$(python -c 'import zlib; print(zlib.__file__)')" || true
          echo "::endgroup::"

          echo "::group::OpenSSL / zlib versions Python is using at runtime"
          python -c "import ssl; print('OpenSSL:', ssl.OPENSSL_VERSION)"
          python -c "import zlib; print('zlib   :', zlib.ZLIB_VERSION)"
          echo "::endgroup::"

          echo "::group::Ubuntu package versions"
          dpkg -l libssl3 zlib1g 2>/dev/null | awk '/^ii/ { print $2, $3 }' || true
          echo "::endgroup::"

          echo "::group::Ubuntu security patches applied to libssl3 (last 40 lines)"
          apt-get changelog libssl3 2>/dev/null | head -40 || true
          echo "::endgroup::"

      - name: Build newer OpenSSL for bundling (Linux only)
        # Ubuntu 26.04's system libssl.so.3 / libcrypto.so.3 is 3.5.5 (Jan 2026)
        # and Ubuntu will only backport patches within that string, not rev it.
        # PyInstaller walks _ssl.so's shared-library dependencies via ldd, which
        # honors LD_LIBRARY_PATH — so building a newer 3.5.x locally and prepending
        # its lib dir makes PyInstaller bundle the newer copies instead of the
        # system ones, closing the BDBA delta without changing any source code.
        # Stay within the 3.5 line so ABI is compatible with the _ssl.so that
        # CPython was compiled against; bump OPENSSL_VER whenever a newer 3.5.x
        # patch ships (check https://openssl-library.org/source/).
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENSSL_VER: "3.5.7"
        run: |
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VER}/openssl-${OPENSSL_VER}.tar.gz" -o openssl.tar.gz
          tar xzf openssl.tar.gz
          pushd "openssl-${OPENSSL_VER}"
          ./Configure --prefix="$HOME/openssl-new" \
                      --openssldir="$HOME/openssl-new/ssl" \
                      shared no-tests linux-x86_64 > /dev/null
          make -j"$(nproc)" > /tmp/openssl-build.log 2>&1 || (tail -80 /tmp/openssl-build.log; exit 1)
          make install_sw > /tmp/openssl-install.log 2>&1 || (tail -80 /tmp/openssl-install.log; exit 1)
          popd
          rm -rf "openssl-${OPENSSL_VER}" openssl.tar.gz

          # Prepend for every subsequent step (Build binary, Determine artifact name, ...).
          echo "LD_LIBRARY_PATH=$HOME/openssl-new/lib64:$HOME/openssl-new/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          # Verify Python picks up the freshly-built OpenSSL under the new path.
          LD_LIBRARY_PATH="$HOME/openssl-new/lib64:$HOME/openssl-new/lib:${LD_LIBRARY_PATH:-}" \
            python -c "import ssl; v = ssl.OPENSSL_VERSION; print('Python now sees:', v); assert '${OPENSSL_VER}' in v, f'Expected ${OPENSSL_VER} in {v}'"

          # And confirm _ssl.so's ldd walk resolves to the new location.
          LD_LIBRARY_PATH="$HOME/openssl-new/lib64:$HOME/openssl-new/lib:${LD_LIBRARY_PATH:-}" \
            ldd "$(python -c 'import _ssl; print(_ssl.__file__)')" | grep -E 'lib(ssl|crypto)'

      - name: Build newer zlib for bundling (Linux only)
        # Ubuntu 26.04's system libz.so.1 is upstream 1.3.1 but shipped with
        # Debian's dfsg patches (package string `1:1.3.dfsg+really1.3.1-1ubuntu3`)
        # which some scanners flag as a version mismatch against pristine upstream.
        # Building from source and prepending the lib dir to LD_LIBRARY_PATH makes
        # PyInstaller bundle the pristine copy — same ABI (soname stays libz.so.1),
        # no dfsg patches. Bump ZLIB_VER when upstream releases a newer patch
        # (https://zlib.net/).
        if: runner.os == 'Linux'
        shell: bash
        env:
          ZLIB_VER: "1.3.2"
        run: |
          curl -fsSL "https://zlib.net/zlib-${ZLIB_VER}.tar.gz" -o zlib.tar.gz
          tar xzf zlib.tar.gz
          pushd "zlib-${ZLIB_VER}"
          ./configure --prefix="$HOME/zlib-new" --libdir="$HOME/zlib-new/lib" > /dev/null
          make -j"$(nproc)" > /tmp/zlib-build.log 2>&1 || (tail -80 /tmp/zlib-build.log; exit 1)
          make install > /tmp/zlib-install.log 2>&1 || (tail -80 /tmp/zlib-install.log; exit 1)
          popd
          rm -rf "zlib-${ZLIB_VER}" zlib.tar.gz

          # Prepend so PyInstaller's ldd walk finds our pristine copy first.
          echo "LD_LIBRARY_PATH=$HOME/zlib-new/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

          # Verify zlib.so's ldd walk resolves to the new location.
          LD_LIBRARY_PATH="$HOME/zlib-new/lib:${LD_LIBRARY_PATH:-}" \
            ldd "$(python -c 'import zlib; print(zlib.__file__)')" | grep libz

      - name: Build binary
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Determine artifact name
        id: name
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "artifact=coverity-metrics-${{ matrix.artifact_os }}-${version}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error
          retention-days: 30

  find-preflight-run:
    name: Locate preflight build for this tag's SHA
    # Only runs on tag push. Finds the most recent successful workflow_dispatch
    # `build` run for the exact commit the tag points at, and hands its run-id
    # to `release` so we can download the already-built artifacts instead of
    # re-running the whole matrix. Fails loudly if no such run exists — that
    # means someone pushed a tag without running `release.ps1`'s preflight
    # (or the preflight artifacts have aged out past the 30-day retention).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.lookup.outputs.run_id }}
    steps:
      - name: Find latest successful build-binaries run for this commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          echo "Looking for a green build-binaries.yml run against $sha ..."
          run_id=$(gh run list \
            --repo="${{ github.repository }}" \
            --workflow=build-binaries.yml \
            --status=success \
            --limit=30 \
            --json databaseId,headSha \
            --jq "[.[] | select(.headSha==\"$sha\")][0].databaseId")
          if [[ -z "${run_id:-}" || "$run_id" == "null" ]]; then
            echo "::error::No successful build-binaries.yml run found for SHA $sha."
            echo "::error::Cut releases via ./release.ps1 which runs the preflight, or manually dispatch the workflow against this commit before tagging."
            exit 1
          fi
          echo "Using preflight run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  publish-pypi:
    name: Build sdist/wheel and publish to PyPI
    # Runs on tag push only. Doesn't rebuild the binaries — those come from
    # the preflight run via `release` below. Requires `find-preflight-run` so
    # a stale-tag push (no matching preflight artifacts) skips PyPI publish.
    needs: [find-preflight-run]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/coverity-metrics
    permissions:
      contents: read
      # id-token is required for PyPI Trusted Publishing (OIDC).
      id-token: write
    env:
      # 'true' when a PYPI_API_TOKEN secret is configured; otherwise fall back to Trusted Publishing (OIDC).
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Verify tag matches package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version=$(python -c "import re,pathlib; m=re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('coverity_metrics/__version__.py').read_text()); print(m.group(1))")
          echo "Tag version: $tag"
          echo "Package version: $pkg_version"
          if [[ "$tag" != "$pkg_version" ]]; then
            echo "::error::Git tag ($tag) does not match coverity_metrics/__version__.py ($pkg_version)"
            exit 1
          fi

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        if: env.HAS_PYPI_TOKEN != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Publish to PyPI (API token)
        if: env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  release:
    name: Attach binaries to release
    needs: [find-preflight-run, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download preflight artifacts
        # Cross-run download from the preflight `build` run whose id was
        # resolved above. Skips the tag-triggered rebuild entirely.
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ needs.find-preflight-run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          # Rename OS-specific binaries into predictable filenames for the release page.
          # `linux-v*` glob is deliberately anchored on the `-v` prefix of the tag
          # version so it matches only the modern-glibc artifact folder and never
          # the `linux-glibc2.35-v*` variant.
          cp artifacts/coverity-metrics-windows-*/coverity-metrics.exe release/coverity-metrics-windows-${GITHUB_REF_NAME}.exe
          cp artifacts/coverity-metrics-linux-v*/coverity-metrics       release/coverity-metrics-linux-${GITHUB_REF_NAME}
          cp artifacts/coverity-metrics-linux-glibc2.35-v*/coverity-metrics release/coverity-metrics-linux-glibc2.35-${GITHUB_REF_NAME}
          chmod +x release/coverity-metrics-linux-${GITHUB_REF_NAME} \
                   release/coverity-metrics-linux-glibc2.35-${GITHUB_REF_NAME}
          cp config.json.example release/
          cp README.md release/
          ls -la release/

      - name: Extract CHANGELOG section for this version
        id: changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="release-notes.md"
          # Capture everything from "## [<version>] - <date>" up to (but not including) the next "## [" heading.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { p = 1; print; next }
            p && /^## \[/ { exit }
            p { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]]; then
            echo "::warning::No CHANGELOG.md entry found for version $version; falling back to a generic body."
            printf '## %s\n\nRelease %s.\n' "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" > "$notes_file"
          fi
          echo "notes_path=$notes_file" >> "$GITHUB_OUTPUT"
          echo "----- release body preview -----"
          cat "$notes_file"
          echo "--------------------------------"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          body_path: ${{ steps.changelog.outputs.notes_path }}
          # Auto-generated "What's Changed" notes are appended below the CHANGELOG excerpt.
          generate_release_notes: true
